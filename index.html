<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Thank You | Jolly Sutrula</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Raleway:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#075B55;--teal-dark:#064943;--gold:#E5B84B;--cream:#FAF5E9;--ink:#24423D;--muted:#687A72}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{min-height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:#075B55;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
/* Brand-approved amber background curves */
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border:2px solid rgba(229,184,75,.52);border-radius:50%}
body:before{width:105vw;height:105vw;left:-57vw;top:-76vw;box-shadow:0 0 0 18px rgba(229,184,75,.16),0 0 0 42px rgba(229,184,75,.09)}
body:after{width:115vw;height:115vw;right:-67vw;bottom:-89vw;box-shadow:0 0 0 22px rgba(229,184,75,.16),0 0 0 48px rgba(229,184,75,.09)}
header{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:7px 14px 4px}
.brand-logo{display:block;width:min(210px,44vw);height:68px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}
.brand-tagline{margin:0;color:#FAF5E9;font-family:"DM Sans",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;line-height:1.3;text-align:center}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:stretch;gap:8px;padding:5px 14px 9px}
.card{align-self:center;margin:auto;width:min(100%,520px);text-align:center;background:var(--cream);border:1px solid rgba(255,255,255,.8);border-radius:23px;padding:14px 24px 17px;box-shadow:0 2px 3px rgba(61,43,8,.08),0 8px 0 -4px rgba(255,255,255,.55),0 17px 28px rgba(63,45,8,.23),0 27px 42px rgba(63,45,8,.13),inset 0 1px 0 #fff;transform:translateY(-1px)}
.tick-stage{width:75px;height:75px;margin:0 auto 6px;position:relative;display:grid;place-items:center}
.tick-halo{position:absolute;inset:4px;border-radius:50%;background:#EAF0E8}
.tick-halo:after{content:"";position:absolute;inset:-5px;border:1.5px solid rgba(7,91,85,.32);border-radius:50%;animation:ripple 2.5s ease-out infinite}
.tick-circle{position:relative;width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:var(--teal);box-shadow:0 5px 12px rgba(7,91,85,.2);animation:pop .5s ease-out both}
.tick-circle svg{width:29px;height:29px;fill:none;stroke:white;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .6s .2s ease forwards}
@keyframes ripple{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.55);opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
h1{margin:0;color:var(--teal);font-family:"Playfair Display",Georgia,serif;font-size:clamp(34px,7vw,43px);line-height:1.06;letter-spacing:-.7px}
.confirmation{margin:8px auto 0;color:var(--ink);font-size:clamp(13px,3.4vw,15px);font-weight:700;line-height:1.4}
.rule{width:40px;height:2px;margin:10px auto 8px;background:var(--gold);border-radius:3px}
.followup{max-width:390px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.5;text-align:center;text-wrap:balance}

.contact-area{width:min(100%,560px);text-align:center;padding:0 4px 2px;margin:0 auto;align-self:end}
.contact-plain{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:clamp(12px,4vw,26px)}
.contact-plain a{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#FAF5E9;text-decoration:none;font-size:11px;font-weight:700;line-height:1.5;white-space:nowrap;transition:color .2s ease,transform .2s ease,opacity .2s ease;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
.contact-plain a svg{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.contact-plain a .bi-whatsapp{font-size:17px;line-height:1;display:inline-block}
.contact-plain a:hover {
  color:#E5B84B;
  transform:translateY(-2px);
  text-decoration:none;
}
.contact-plain a:focus-visible {
  color:#E5B84B;
  outline:1px solid rgba(229,184,75,.8);
  outline-offset:4px;
  border-radius:3px;
  text-decoration:none;
}
.contact-plain a:active {
  color:#FAF5E9;
  transform:scale(.97);
  opacity:.82;
}
@media(max-width:360px){.contact-plain{gap:9px}.contact-plain a{font-size:9px;gap:4px}.contact-plain a svg,.contact-plain a .bi-whatsapp{width:14px;height:14px;flex-basis:14px;font-size:14px}}
footer{flex:0 0 auto;min-height:39px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;background:#F7F1E4;border-top:1px solid rgba(7,91,85,.12)}
.footer-lockup{width:100%;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:7px;min-height:22px;white-space:nowrap}
.footer-logo{width:39px;height:18px;object-fit:contain;flex:0 0 auto}
.footer-text,.footer-brand{font-size:10px;line-height:1.2;color:#52635D}
.footer-brand{color:#075B55;font-weight:800;font-size:10px}\n.footer-brand-link{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:3px 5px;min-height:26px;text-decoration:none!important;color:inherit!important;cursor:pointer;pointer-events:auto;transition:opacity .18s ease,transform .18s ease;-webkit-tap-highlight-color:transparent}\n.footer-brand-link:link,.footer-brand-link:visited{color:inherit;text-decoration:none}\n.footer-brand-link:hover{color:#075B55;text-decoration:none;opacity:.82;transform:translateY(-1px)}\n.footer-brand-link:focus-visible{opacity:.9;outline:1px solid rgba(7,91,85,.45);outline-offset:3px;border-radius:4px}\n.footer-brand-link:active{color:#075B55;text-decoration:none;opacity:.72;transform:scale(.98)}
.sep{color:#9B9B8D}
.copyright{margin:0;color:#74827B;font-size:9px}
@media(max-width:390px){header{padding-top:3px}.brand-logo{height:57px;width:min(175px,43vw)}.brand-tagline{font-size:10px}main{gap:8px;padding:3px 10px 6px}.card{padding:10px 15px 12px;border-radius:19px}.tick-stage{width:65px;height:65px}.tick-circle{width:48px;height:48px}.tick-circle svg{width:26px;height:26px}.followup{font-size:12px}.contact-plain{column-gap:7px}.contact-plain a{font-size:9px}.footer-lockup{gap:4px}.footer-logo{width:31px}.footer-text,.footer-brand{font-size:8px}.copyright{font-size:8px}}
@media(max-height:690px){header{padding-top:2px}.brand-logo{height:51px}main{gap:7px;padding-top:2px;padding-bottom:4px}.card{padding:8px 18px 10px}.tick-stage{width:58px;height:58px;margin-bottom:4px}.tick-circle{width:43px;height:43px}.tick-circle svg{width:23px;height:23px}.confirmation{margin-top:5px}.rule{margin:7px auto 6px}.followup{font-size:12px}footer{min-height:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.tick-circle svg{stroke-dashoffset:0}}

/* Final override: remove browser link underline in every state */
footer .footer-brand-link,
footer .footer-brand-link:link,
footer .footer-brand-link:visited,
footer .footer-brand-link:hover,
footer .footer-brand-link:focus,
footer .footer-brand-link:focus-visible,
footer .footer-brand-link:active,
footer .footer-brand-link *,
footer .footer-brand-link *:link,
footer .footer-brand-link *:visited {
  text-decoration: none !important;
  text-decoration-line: none !important;
  text-decoration-color: transparent !important;
  border-bottom: 0 !important;
  box-shadow: none !important;
}
footer .footer-brand-link::before,
footer .footer-brand-link::after,
footer .footer-brand-link *::before,
footer .footer-brand-link *::after {
  text-decoration: none !important;
  border-bottom: 0 !important;
  box-shadow: none !important;
}


/* Requested contact label and single-line SolutAIn Works footer lockup */
.contact-pill {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 9px;
  padding:5px 16px;
  min-height:25px;
  border:1px solid rgba(229,184,75,.95);
  border-radius:999px;
  background:#E5B84B;
  color:#075B55;
  font-size:9px;
  font-weight:800;
  letter-spacing:1.25px;
  line-height:1;
}
.footer-brand-link {
  display:inline-flex !important;
  flex-direction:row !important;
  flex-wrap:nowrap !important;
  align-items:center !important;
  justify-content:center !important;
  white-space:nowrap !important;
}
.footer-brand {
  font-family:"Raleway",Arial,sans-serif !important;
  font-weight:700 !important;
  white-space:nowrap !important;
  display:inline-block !important;
}
.footer-logo { flex:0 0 auto !important; }


/* Final success-card treatment: Variant 08 shape + Variant 02 double-gold frame */
.card.card-final {
  position: relative;
  isolation: isolate;
  background: #FAF5E9;
  border: 2px solid #E5B84B;
  border-radius: 30px 12px 30px 12px;
  outline: 1px solid rgba(229,184,75,.58);
  outline-offset: 5px;
  box-shadow:
    0 3px 0 rgba(7,91,85,.08),
    0 17px 30px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.95);
  transform: none;
}


/* FINAL BACKGROUND: exact visual ingredients from options 03, 05 and 08 */
body {
  background:
    linear-gradient(145deg,
      transparent 0 42%,
      #0B6B60 42% 58%,
      transparent 58% 100%),
    radial-gradient(circle at 15% 15%,
      #168879 0 2%,
      transparent 36%),
    radial-gradient(circle at 90% 85%,
      #0C756A 0 2%,
      transparent 42%),
    radial-gradient(ellipse at 50% 45%,
      #138477 0%,
      #075B55 58%,
      #043F3A 100%);
}
body::before,
body::after {
  border-style: dashed;
  border-width: 1px;
  border-color: rgba(245,202,105,.8);
  box-shadow:
    0 0 0 3px rgba(229,184,75,.22),
    0 0 0 10px rgba(229,184,75,.12),
    0 0 0 20px rgba(229,184,75,.07),
    0 0 0 22px rgba(229,184,75,.08);
  opacity: .95;
}

</style>
</head>
